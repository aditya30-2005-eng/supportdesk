# Render Blueprint for a free deployment: API, React site and PostgreSQL.
# The free plan has no background workers, so Celery tasks run inside the API
# process (CELERY_TASK_ALWAYS_EAGER) and emails are printed in the API logs.
# If Render adds a suffix to a service name, update the three URLs below to match.

services:
  - type: web
    name: supportdesk-api-aditya
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      python manage.py seed_demo
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: supportdesk-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://supportdesk-web-aditya.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://supportdesk-web-aditya.onrender.com
      - key: FRONTEND_URL
        value: https://supportdesk-web-aditya.onrender.com

  - type: web
    name: supportdesk-web-aditya
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://supportdesk-api-aditya.onrender.com/api

databases:
  - name: supportdesk-db
    databaseName: supportdesk
    user: supportdesk
    plan: free
    region: singapore
